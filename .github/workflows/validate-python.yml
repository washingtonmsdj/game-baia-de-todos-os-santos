name: Validar scripts e referências

on:
  push:
    paths:
      - "tools/**/*.py"
      - "world/**/*.json"
      - "schemas/**/*.json"
      - "docs/references/**/*.json"
      - ".github/workflows/validate-python.yml"
  pull_request:
    paths:
      - "tools/**/*.py"
      - "world/**/*.json"
      - "schemas/**/*.json"
      - "docs/references/**/*.json"
      - ".github/workflows/validate-python.yml"

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar scripts sem executar Blender
        run: |
          python -m compileall -q tools

      - name: Validar sintaxe de todos os JSON versionados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(
              list(Path("world").rglob("*.json"))
              + list(Path("schemas").rglob("*.json"))
              + list(Path("docs/references").rglob("*.json"))
          )
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY

      - name: Validar catálogo de referências
        run: |
          python tools/references/validate_registry.py --root .

      - name: Validar CLIs auxiliares
        run: |
          python tools/aleph/inspect_capture.py --help >/dev/null
          python tools/references/register_media.py --help >/dev/null
          python tools/references/reference_gaps.py --help >/dev/null
          python tools/references/import_commons.py --help >/dev/null
