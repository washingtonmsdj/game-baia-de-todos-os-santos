name: Validar scripts Python

on:
  push:
    paths:
      - "tools/**/*.py"
      - ".github/workflows/validate-python.yml"
  pull_request:
    paths:
      - "tools/**/*.py"
      - ".github/workflows/validate-python.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar scripts sem executar Blender
        run: |
          python -m compileall -q tools

      - name: Validar CLI do inspector Aleph
        run: |
          python tools/aleph/inspect_capture.py --help >/dev/null
